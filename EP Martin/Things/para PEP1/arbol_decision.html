<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol de Decisión · Estadística Inferencial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface2: #F0EDE6;
  --border: #E2DDD5;
  --border2: #C9C3B8;
  --text1: #1A1714;
  --text2: #5C5650;
  --text3: #9A9490;
  --accent: #2D5F8A;
  --accent-light: #EBF3FA;
  --accent-mid: #5A92BC;
  --green: #1A6B4A;
  --green-light: #E6F5EE;
  --green-mid: #4D9E7A;
  --coral: #8B2E1A;
  --coral-light: #FAF0EC;
  --coral-mid: #C4694F;
  --purple: #4A3580;
  --purple-light: #F0EEFB;
  --purple-mid: #8A78C0;
  --amber: #7A4F0D;
  --amber-light: #FDF4E3;
  --amber-mid: #C08A3D;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.05);
  --r: 10px;
  --r-sm: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 60px;
}

/* ── HEADER ── */
header {
  width: 100%;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 32px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}
.header-icon {
  width: 38px; height: 38px;
  background: var(--accent);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.header-icon svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.header-text h1 { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text1); font-weight: 400; }
.header-text p { font-size: 12px; color: var(--text3); margin-top: 1px; letter-spacing: 0.02em; }
.header-badge {
  margin-left: auto;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
  letter-spacing: 0.03em;
  white-space: nowrap;
}

/* ── LAYOUT ── */
.wrapper {
  width: 100%;
  max-width: 640px;
  padding: 36px 20px 0;
}

/* ── BREADCRUMB ── */
#breadcrumb {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  min-height: 28px;
  margin-bottom: 24px;
}
.bc-item {
  font-size: 12px;
  color: var(--text2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px;
  white-space: nowrap;
}
.bc-sep { font-size: 12px; color: var(--text3); }
.bc-empty { font-size: 12px; color: var(--text3); font-style: italic; }

/* ── QUESTION CARD ── */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-md);
  animation: slideIn 0.18s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.q-card-top {
  padding: 24px 28px 0;
}
.q-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-light);
  border-radius: 20px;
  padding: 3px 10px;
  margin-bottom: 14px;
}
.q-text {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  color: var(--text1);
  line-height: 1.35;
  font-weight: 400;
  margin-bottom: 14px;
}
.q-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text2);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-mid);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  margin-bottom: 20px;
  line-height: 1.6;
}

.q-opts {
  display: flex;
  flex-direction: column;
  gap: 0;
  border-top: 1px solid var(--border);
}
.q-opt {
  width: 100%;
  text-align: left;
  padding: 16px 28px;
  background: var(--surface);
  border: none;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text1);
  line-height: 1.45;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: background 0.1s;
}
.q-opt:last-child { border-bottom: none; }
.q-opt:hover { background: var(--accent-light); }
.q-opt:hover .opt-arrow { opacity: 1; transform: translateX(0); }
.opt-num {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
}
.opt-arrow {
  margin-left: auto;
  flex-shrink: 0;
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 0.1s, transform 0.1s;
  color: var(--accent-mid);
  font-size: 16px;
}

.q-card-foot {
  padding: 14px 28px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
}
.back-btn {
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  transition: color 0.1s;
}
.back-btn:hover { color: var(--text1); }

/* ── RESULT CARD ── */
.r-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: slideIn 0.2s ease;
}
.r-head { padding: 28px; }
.r-head-p  { background: var(--green-light); border-bottom: 1px solid #B8DFD0; }
.r-head-np { background: var(--coral-light); border-bottom: 1px solid #EDCABF; }
.r-head-c  { background: var(--purple-light); border-bottom: 1px solid #CEC9F0; }
.r-head-t  { background: var(--amber-light); border-bottom: 1px solid #EDCF9A; }

.r-tag {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.r-head-p  .r-tag { color: var(--green); }
.r-head-np .r-tag { color: var(--coral); }
.r-head-c  .r-tag { color: var(--purple); }
.r-head-t  .r-tag { color: var(--amber); }

.r-name {
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  font-weight: 400;
  line-height: 1.25;
}
.r-head-p  .r-name { color: #0D4A35; }
.r-head-np .r-name { color: #5A1E0F; }
.r-head-c  .r-name { color: #2D2060; }
.r-head-t  .r-name { color: #4F310A; }

.r-body { padding: 24px 28px; }
.r-section {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
  margin-top: 20px;
}
.r-section:first-child { margin-top: 0; }

.r-func {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  background: var(--text1);
  color: #E8E4DC;
  border-radius: var(--r-sm);
  padding: 14px 16px;
  line-height: 1.7;
  word-break: break-all;
}

.r-conds { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.r-cond {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13.5px;
  color: var(--text2);
  line-height: 1.5;
}
.r-cond-icon {
  flex-shrink: 0;
  width: 18px; height: 18px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  font-weight: 700;
  margin-top: 1px;
}
.icon-p  { background: var(--green-light); color: var(--green); border: 1px solid #B8DFD0; }
.icon-np { background: var(--coral-light); color: var(--coral); border: 1px solid #EDCABF; }
.icon-c  { background: var(--purple-light); color: var(--purple); border: 1px solid #CEC9F0; }
.icon-t  { background: var(--amber-light); color: var(--amber); border: 1px solid #EDCF9A; }

.r-note {
  font-size: 13px;
  color: var(--text2);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border2);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  line-height: 1.6;
}
.r-note-p  { border-left-color: var(--green-mid); }
.r-note-np { border-left-color: var(--coral-mid); }
.r-note-c  { border-left-color: var(--purple-mid); }
.r-note-t  { border-left-color: var(--amber-mid); }

.r-foot {
  padding: 16px 28px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.r-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}
.r-btn:hover { background: var(--surface2); color: var(--text1); border-color: var(--border2); }

/* ── PROGRESS ── */
.progress-bar {
  width: 100%;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 24px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s ease;
}
</style>
</head>
<body>

<header>
  <div class="header-icon">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="7" cy="6" r="2" stroke-width="1.5"/><circle cx="17" cy="12" r="2" stroke-width="1.5"/><circle cx="10" cy="18" r="2" stroke-width="1.5"/></svg>
  </div>
  <div class="header-text">
    <h1>Árbol de Decisión Estadística</h1>
    <p>Inferencia y Modelos Estadísticos · Caps. 5, 6, 8–11</p>
  </div>
  <div class="header-badge">Inferencia · R</div>
</header>

<div class="wrapper">
  <div id="breadcrumb"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div id="main"></div>
</div>

<script>
const TREE = {

  /* ── PUNTO DE ENTRADA ── */
  start:{
    badge:"Punto de partida",
    q:"¿Qué tipo de análisis necesitas?",
    hint:null,
    opts:[
      {label:"Comparar grupos (numéricos) — medias, tiempos, etc.", next:"numGroups", crumb:"Medias"},
      {label:"Relacionar 2 variables numéricas — correlación y regresión", next:"relationNorm", crumb:"Relación"},
      {label:"Analizar frecuencias o proporciones (categóricos)", next:"catGroups", crumb:"Frecuencias"}
    ]
  },

  /* ════════════════════════════════
     BLOQUE NUMÉRICO
  ════════════════════════════════ */
  numGroups:{
    badge:"Variables numéricas",
    q:"¿Cuántos grupos estás comparando?",
    hint:null,
    opts:[
      {label:"1 grupo — comparado contra un valor fijo conocido", next:"norm1", crumb:"1 grupo"},
      {label:"2 grupos", next:"norm2", crumb:"2 grupos"},
      {label:"3 o más grupos", next:"norm3", crumb:"3+ grupos"}
    ]
  },

  /* RELACIÓN NUMÉRICA */
  relationNorm:{
    badge:"Relación numérica",
    q:"¿Ambas variables cumplen normalidad?",
    hint:"shapiro.test(x) y shapiro.test(y)  →  ambos p ≥ 0.05",
    opts:[
      {label:"Sí — ambas son normales", next:"res_pearson", crumb:"Paramétrica"},
      {label:"No — al menos una no es normal", next:"res_spearman", crumb:"No paramétrica"}
    ]
  },

  /* 1 GRUPO */
  norm1:{
    badge:"Verificar normalidad",
    q:"¿Los datos de la muestra son normales?",
    hint:"shapiro.test(datos)  →  si p ≥ 0.05, no se rechaza normalidad",
    opts:[
      {label:"Sí — p ≥ 0.05 en Shapiro-Wilk", next:"norm1_transf_check", crumb:"Normal ✓"},
      {label:"No — p < 0.05 en Shapiro-Wilk", next:"norm1_noNormal", crumb:"No normal ✗"}
    ]
  },
  norm1_transf_check:{
    badge:"1 muestra · paramétrica",
    q:"¿Necesitas transformar los datos antes de analizar?",
    hint:"Las transformaciones (log, Tukey, Box-Cox) permiten cumplir normalidad cuando los datos originales son asimétricos.",
    opts:[
      {label:"No — usaré los datos originales directamente", next:"res_t1", crumb:"Sin transformación"},
      {label:"Sí — aplicaré una transformación primero (Cap. 11)", next:"transf_type1", crumb:"Con transformación"}
    ]
  },
  transf_type1:{
    badge:"Transformación de datos · Cap. 11",
    q:"¿Qué transformación se ajusta mejor a tus datos?",
    hint:"Aplica la transformación, verifica normalidad con shapiro.test() y luego realiza la prueba sobre los datos transformados.",
    opts:[
      {label:"Transformación logarítmica — distribución muy asimétrica positiva", next:"res_t1_log", crumb:"Log"},
      {label:"Escalera de Tukey — buscar λ óptimo con transformTukey()", next:"res_t1_tukey", crumb:"Tukey"},
      {label:"Box-Cox — versión escalada de Tukey con BoxCox()", next:"res_t1_boxcox", crumb:"Box-Cox"}
    ]
  },

  norm1_noNormal:{
    badge:"1 muestra · no normal",
    q:"¿Quieres intentar una transformación para cumplir normalidad?",
    hint:"Las transformaciones de datos pueden convertir distribuciones asimétricas en aproximadamente normales (Cap. 11).",
    opts:[
      {label:"Sí — intentaré transformar los datos", next:"transf_type1", crumb:"Intentar transformación"},
      {label:"No — usaré una prueba no paramétrica directamente", next:"res_w1", crumb:"No paramétrica"}
    ]
  },

  /* 2 GRUPOS */
  norm2:{
    badge:"Verificar normalidad",
    q:"¿Ambos grupos son normales?",
    hint:"shapiro.test() en cada grupo por separado  →  ambos con p ≥ 0.05",
    opts:[
      {label:"Sí — p ≥ 0.05 en los dos grupos", next:"indep2p", crumb:"Normal ✓"},
      {label:"No — al menos uno falla la prueba", next:"norm2_noNormal", crumb:"No normal ✗"}
    ]
  },
  norm2_noNormal:{
    badge:"2 grupos · no normal",
    q:"¿Quieres intentar una transformación para cumplir normalidad?",
    hint:"Cap. 11: transformar los datos puede permitir aplicar la prueba paramétrica equivalente.",
    opts:[
      {label:"Sí — intentaré transformar los datos", next:"transf_type2", crumb:"Intentar transformación"},
      {label:"No — usaré una prueba no paramétrica directamente", next:"indep2np", crumb:"No paramétrica"}
    ]
  },
  transf_type2:{
    badge:"Transformación de datos · Cap. 11",
    q:"¿Qué transformación se ajusta mejor a tus datos?",
    hint:"Aplica la transformación a ambos grupos, verifica normalidad y luego decide si procede la prueba paramétrica.",
    opts:[
      {label:"Transformación logarítmica", next:"indep2p_post_transf", crumb:"Log"},
      {label:"Escalera de Tukey", next:"indep2p_post_transf", crumb:"Tukey"},
      {label:"Box-Cox", next:"indep2p_post_transf", crumb:"Box-Cox"}
    ]
  },
  indep2p_post_transf:{
    badge:"Después de transformar · 2 grupos",
    q:"Tras la transformación, ¿los datos son ahora normales?",
    hint:"shapiro.test() en cada grupo transformado  →  ambos con p ≥ 0.05",
    opts:[
      {label:"Sí — ahora cumplen normalidad", next:"indep2p", crumb:"Normal ✓"},
      {label:"No — aún no cumplen normalidad", next:"indep2np", crumb:"No paramétrica"}
    ]
  },

  indep2p:{
    badge:"Diseño muestral",
    q:"¿Las muestras son independientes o pareadas?",
    hint:"Independientes = grupos distintos. Pareadas = mismo sujeto medido dos veces (ej. antes/después).",
    opts:[
      {label:"Independientes — grupos distintos entre sí", next:"levene2", crumb:"Independientes"},
      {label:"Pareadas — mismo sujeto, dos mediciones", next:"res_tpar", crumb:"Pareadas"}
    ]
  },
  indep2np:{
    badge:"Diseño muestral",
    q:"¿Las muestras son independientes o pareadas?",
    hint:"Independientes = grupos distintos. Pareadas = mismo sujeto medido dos veces.",
    opts:[
      {label:"Independientes — grupos distintos entre sí", next:"res_mw", crumb:"Independientes"},
      {label:"Pareadas — mismo sujeto, dos mediciones", next:"res_wpar", crumb:"Pareadas"}
    ]
  },
  levene2:{
    badge:"Verificar homocedasticidad",
    q:"¿Las varianzas de ambos grupos son homogéneas?",
    hint:"leveneTest(y ~ grupo, data)  →  si p ≥ 0.05, varianzas homogéneas",
    opts:[
      {label:"Sí — Levene p ≥ 0.05 (varianzas iguales)", next:"res_tindep", crumb:"Var. iguales"},
      {label:"No — Levene p < 0.05 (varianzas distintas)", next:"res_welch", crumb:"Var. distintas"}
    ]
  },

  /* 3+ GRUPOS */
  norm3:{
    badge:"Verificar normalidad",
    q:"¿Todos los grupos son normales?",
    hint:"shapiro.test() en cada grupo por separado  →  todos con p ≥ 0.05",
    opts:[
      {label:"Sí — todos con p ≥ 0.05", next:"indep3p", crumb:"Normal ✓"},
      {label:"No — al menos uno falla", next:"norm3_noNormal", crumb:"No normal ✗"}
    ]
  },
  norm3_noNormal:{
    badge:"3+ grupos · no normal",
    q:"¿Quieres intentar una transformación para cumplir normalidad?",
    hint:"Cap. 11: aplicar transformación logarítmica, Tukey o Box-Cox puede normalizar los datos.",
    opts:[
      {label:"Sí — intentaré transformar los datos", next:"transf_type3", crumb:"Intentar transformación"},
      {label:"No — usaré una prueba no paramétrica directamente", next:"indep3np", crumb:"No paramétrica"}
    ]
  },
  transf_type3:{
    badge:"Transformación de datos · Cap. 11",
    q:"¿Qué transformación se ajusta mejor a tus datos?",
    hint:"Transforma todos los grupos, verifica normalidad y homocedasticidad, y luego decide si procede ANOVA.",
    opts:[
      {label:"Transformación logarítmica", next:"indep3p_post_transf", crumb:"Log"},
      {label:"Escalera de Tukey", next:"indep3p_post_transf", crumb:"Tukey"},
      {label:"Box-Cox", next:"indep3p_post_transf", crumb:"Box-Cox"}
    ]
  },
  indep3p_post_transf:{
    badge:"Después de transformar · 3+ grupos",
    q:"Tras la transformación, ¿los datos son ahora normales?",
    hint:"shapiro.test() en cada grupo transformado  →  todos con p ≥ 0.05",
    opts:[
      {label:"Sí — ahora cumplen normalidad", next:"indep3p", crumb:"Normal ✓"},
      {label:"No — aún no cumplen normalidad", next:"indep3np", crumb:"No paramétrica"}
    ]
  },

  indep3p:{
    badge:"Diseño muestral",
    q:"¿Las muestras son independientes o correlacionadas?",
    hint:"Correlacionadas (medidas repetidas) = mismo sujeto evaluado en 3+ condiciones.",
    opts:[
      {label:"Independientes — grupos distintos entre sí", next:"levene3", crumb:"Independientes"},
      {label:"Correlacionadas — mismo sujeto, 3+ mediciones", next:"mauchly3", crumb:"Medidas repetidas"}
    ]
  },
  indep3np:{
    badge:"Diseño muestral",
    q:"¿Las muestras son independientes o correlacionadas?",
    hint:"Correlacionadas (medidas repetidas) = mismo sujeto evaluado en 3+ condiciones.",
    opts:[
      {label:"Independientes — grupos distintos entre sí", next:"res_kruskal", crumb:"Independientes"},
      {label:"Correlacionadas — mismo sujeto, 3+ mediciones", next:"res_friedman", crumb:"Medidas repetidas"}
    ]
  },
  levene3:{
    badge:"Verificar homocedasticidad",
    q:"¿Las varianzas de todos los grupos son homogéneas?",
    hint:"leveneTest(variable ~ grupo)  →  p ≥ 0.05 indica homocedasticidad\nAlternativa rápida: razón max/min varianzas ≤ 1.5",
    opts:[
      {label:"Sí — Levene p ≥ 0.05 o razón ≤ 1.5", next:"res_anova_i", crumb:"Var. homogéneas"},
      {label:"No — Levene p < 0.05 o razón > 1.5", next:"res_kruskal", crumb:"Var. heterogéneas"}
    ]
  },
  mauchly3:{
    badge:"Verificar esfericidad",
    q:"¿La matriz de varianzas-covarianzas es esférica?",
    hint:"La prueba de Mauchly está incluida en la salida de ezANOVA()  →  p ≥ 0.05 indica esfericidad",
    opts:[
      {label:"Sí — Mauchly p ≥ 0.05 (esfericidad cumplida)", next:"res_anova_r", crumb:"Esférico ✓"},

/* ── STATE ── */
let cur = 'start';
let hist = [];

const RESULT_DEPTH_ESTIMATE = 7;

/* ── RENDER ── */
function render() {
  const node = TREE[cur];
  const crumbs = hist.map(h => h.crumb);

  // breadcrumb
  const bcEl = document.getElementById('breadcrumb');
  if (crumbs.length === 0) {
    bcEl.innerHTML = '<span class="bc-empty">Sigue las preguntas para encontrar la prueba adecuada</span>';
  } else {
    bcEl.innerHTML = crumbs.map((c,i) =>
      `<span class="bc-item">${c}</span>${i < crumbs.length-1 ? '<span class="bc-sep"> › </span>' : ''}`
    ).join('');
  }

  // progress
  const prog = Math.min(100, Math.round((hist.length / RESULT_DEPTH_ESTIMATE) * 100));
  document.getElementById('progress').style.width = prog + '%';

  const main = document.getElementById('main');

  if (node.result) {
    const cls = node.cls;
    const iconCls = 'icon-' + cls;
    const checkMark = cls === 'p' ? '✓' : cls === 'np' ? '≠' : cls === 't' ? '⟳' : '÷';

    const noteHtml = node.note
      ? `<div class="r-section">Nota</div>
         <div class="r-note r-note-${cls}">${node.note}</div>`
      : '';

    main.innerHTML = `
      <div class="r-card">
        <div class="r-head r-head-${cls}">
          <div class="r-tag">${node.tag}</div>
          <div class="r-name">${node.name.replace(/\n/g,'<br>')}</div>
        </div>
        <div class="r-body">
          <div class="r-section">Función en R</div>
          <div class="r-func">${node.rfunc.replace(/\n/g,'<br>')}</div>
          <div class="r-section">Condiciones que se deben cumplir</div>
          <ul class="r-conds">
            ${node.conds.map(c => `
              <li class="r-cond">
                <span class="r-cond-icon ${iconCls}">${checkMark}</span>
                <span>${c}</span>
              </li>`).join('')}
          </ul>
          ${noteHtml}
        </div>
        <div class="r-foot">
          <button class="r-btn" onclick="restart()">↺ &nbsp;Reiniciar desde cero</button>
          <button class="r-btn" onclick="goBack()">← &nbsp;Paso anterior</button>
        </div>
      </div>`;
  } else {
    const hintHtml = node.hint
      ? `<div class="q-hint">${node.hint.replace(/\n/g,'<br>')}</div>`
      : '<div style="height:.5rem"></div>';

    const optsHtml = node.opts.map((o, i) => `
      <button class="q-opt" onclick="choose(${i})">
        <span class="opt-num">${i+1}</span>
        <span style="flex:1">${o.label}</span>
        <span class="opt-arrow">→</span>
      </button>`).join('');

    const backHtml = hist.length > 0
      ? `<button class="back-btn" onclick="goBack()">← Volver al paso anterior</button>`
      : `<span style="font-size:13px;color:var(--text3)">Caps. 5, 6, 8–11</span>`;

    main.innerHTML = `
      <div class="q-card">
        <div class="q-card-top">
          <div class="q-badge">${node.badge}</div>
          <div class="q-text">${node.q}</div>
          ${hintHtml}
        </div>
        <div class="q-opts">${optsHtml}</div>
        <div class="q-card-foot">${backHtml}</div>
      </div>`;
  }
}

function choose(idx) {
  const opt = TREE[cur].opts[idx];
  hist.push({ from: cur, crumb: opt.crumb });
  cur = opt.next;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goBack() {
  if (hist.length === 0) return;
  const last = hist.pop();
  cur = last.from;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function restart() {
  hist = []; cur = 'start'; render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
